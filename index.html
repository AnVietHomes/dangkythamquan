<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tham quan dự án - An Việt Homes</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #dcf0fa; --card-bg: #fff; --text-main: #111; 
            --border-color: #ccc; --primary-btn: #001a72; --primary-hover: #00104a;
            --header-text: #001a72;
        }
        [data-theme="dark"] {
            --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #f1f1f1; 
            --border-color: #444; --primary-btn: #4facfe; --primary-hover: #00f2fe;
            --header-text: #4facfe;
        }
        
        * { box-sizing: border-box; }
        body { background-color: var(--bg-color); font-family: 'Manrope', sans-serif; color: var(--text-main); transition: background-color 0.3s, color 0.3s; margin: 0; padding: 0; }
        
        /* HEADER */
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; flex-wrap: wrap; gap: 20px; }
        .company-info { display: flex; align-items: center; gap: 15px; }
        .company-info img { height: 50px; transition: 0.3s; }
        .company-name { font-weight: 700; font-size: 14px; text-transform: uppercase; color: var(--header-text); line-height: 1.4; border-left: 2px solid var(--header-text); padding-left: 15px; }
        
        /* TOGGLE GIAO DIỆN */
        .theme-switch-wrapper { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-btn); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* FORM RESPONSIVE */
        .form-container { background: var(--card-bg); max-width: 800px; margin: 20px auto 50px; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 90%; }
        .form-title { text-align: center; font-weight: 800; font-size: 24px; text-transform: uppercase; margin-bottom: 30px; color: var(--header-text);}
        
        /* FLEXBOX ĐỂ ÉP CÙNG 1 DÒNG */
        .row-item { display: flex; align-items: flex-end; margin-bottom: 25px; flex-wrap: nowrap; gap: 15px;}
        .label-col { width: 35%; font-weight: 600; padding-bottom: 8px; flex-shrink: 0;}
        .input-col { width: 65%; flex-grow: 1;}
        
        input, select { width: 100%; border: none; border-bottom: 1px solid var(--border-color); background: transparent; color: var(--text-main); padding: 8px 0; font-family: 'Manrope', sans-serif; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-bottom: 2px solid var(--primary-btn); }
        
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(var(--icon-invert, 0)); cursor: pointer; }
        [data-theme="dark"] { --icon-invert: 1; }
        
        /* ĐỊNH DẠNG Ô CHỌN THỜI GIAN KÉP */
        .time-date-group { display: flex; align-items: center; gap: 10px; width: 100%; }
        .time-date-group .time-input { width: 80px; text-align: center; font-weight: 700; flex-shrink: 0;}
        .time-date-group .date-input { flex-grow: 1; min-width: 120px; }
        .time-date-group .separator { font-weight: 700; color: var(--text-main); }
        
        .checkbox-group label { display: inline-block; width: auto; margin-right: 15px; cursor: pointer; font-weight: 500; }
        .checkbox-group input { width: auto; margin-right: 5px; }
        
        .btn-submit { background: var(--primary-btn); color: #fff; border-radius: 30px; padding: 12px 40px; font-weight: 700; border: none; cursor: pointer; display: block; margin: 30px auto 0; transition: 0.3s; font-family: 'Manrope', sans-serif;}
        .btn-submit:hover { background: var(--primary-hover); }

        @media (max-width: 768px) {
            .top-header { padding: 15px 20px; flex-direction: column; align-items: flex-start; }
            .theme-switch-wrapper { align-self: flex-end; }
            .row-item { flex-direction: column; align-items: flex-start; gap: 5px; margin-bottom: 20px;}
            .label-col { width: 100%; padding-bottom: 0;}
            .input-col { width: 100%; }
            .form-container { padding: 25px; margin-top: 10px; }
        }
    </style>
</head>
<body>
    
    <div class="top-header">
        <div class="company-info">
            <img id="mainLogo" src="logo.svg" alt="An Viet Homes Logo">
            <div class="company-name">CÔNG TY CỔ PHẦN PHÁT TRIỂN DỊCH VỤ<br>VÀ ĐỊA ỐC AN VIỆT HOMES</div>
        </div>
        <div class="theme-switch-wrapper">
            <span>Sáng</span>
            <label class="switch">
                <input type="checkbox" id="themeToggle">
                <span class="slider"></span>
            </label>
            <span>Tối</span>
        </div>
    </div>

    <div class="form-container">
        <div class="form-title">ĐĂNG KÝ THAM QUAN DỰ ÁN</div>
        <form id="bookingForm">
            <!-- Khối thời gian đã ép trên 1 dòng -->
            <div class="row-item">
                <div class="label-col">Thời gian tham quan:</div>
                <div class="input-col time-date-group">
                    <input type="text" id="visitTime" class="time-input" required placeholder="HH:MM" maxlength="5" title="Nhập giờ hệ 24h (VD: 14:30)">
                    <span class="separator">-</span>
                    <input type="date" id="visitDate" class="date-input" required>
                </div>
            </div>
            
            <div class="row-item"><div class="label-col">Họ và tên NVKD:</div><div class="input-col"><input type="text" id="name" required placeholder="Nguyễn Văn A"></div></div>
            <div class="row-item"><div class="label-col">Phòng kinh doanh:</div><div class="input-col"><input type="text" id="department" required placeholder="Khối/Phòng ban"></div></div>
            <div class="row-item"><div class="label-col">Số điện thoại:</div><div class="input-col"><input type="tel" id="phone" required></div></div>
            <div class="row-item"><div class="label-col">Số CCCD:</div><div class="input-col"><input type="text" id="cccd" required></div></div>
            <div class="row-item"><div class="label-col">Số lượng Khách hàng:</div><div class="input-col"><input type="number" id="guestCount" required></div></div>
            <div class="row-item"><div class="label-col">Tổng số người (Sale + Khách):</div><div class="input-col"><input type="number" id="totalCount" required></div></div>
            <div class="row-item"><div class="label-col">Biển số xe (nếu có):</div><div class="input-col"><input type="text" id="plate"></div></div>
            <div class="row-item">
                <div class="label-col">Mục đích:</div>
                <div class="input-col checkbox-group">
                    <label><input type="checkbox" class="purpose" value="Quay video Dự án"> Quay video Dự án</label>
                    <label><input type="checkbox" class="purpose" value="Dẫn khách tham quan"> Dẫn khách tham quan</label>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="btnSubmit">GỬI ĐĂNG KÝ</button>
        </form>
    </div>

    <script>
        document.getElementById('themeToggle').addEventListener('change', function() {
            const html = document.documentElement;
            const logo = document.getElementById('mainLogo');
            if (this.checked) { html.setAttribute('data-theme', 'dark'); if (logo) logo.src = 'logodark.svg'; } 
            else { html.setAttribute('data-theme', 'light'); if (logo) logo.src = 'logo.svg'; }
        });

        const timeInput = document.getElementById('visitTime');
        timeInput.addEventListener('input', function(e) {
            let val = this.value.replace(/\D/g, ''); 
            if (val.length >= 3) {
                this.value = val.substring(0, 2) + ':' + val.substring(2, 4);
            } else {
                this.value = val;
            }
        });
        
        timeInput.addEventListener('blur', function() {
            const regex = /^([01]\d|2[0-3]):([0-5]\d)$/; 
            if (this.value && !regex.test(this.value)) {
                alert("Vui lòng nhập giờ hợp lệ theo định dạng 24h (Ví dụ: 14:30)");
                this.value = '';
            }
        });

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "ĐANG GỬI..."; btn.disabled = true;

            const visitTimeStr = document.getElementById('visitTime').value; 
            const visitDateStr = document.getElementById('visitDate').value; 
            
            const visitDateTime = new Date(`${visitDateStr}T${visitTimeStr}:00`).getTime();
            const now = new Date().getTime();
            const diffMinutes = (visitDateTime - now) / (1000 * 60);
            const isLate = diffMinutes < 50; 

            const dateParts = visitDateStr.split('-');
            const formattedTimeVisit = `${visitTimeStr} - ${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;

            let purposes = [];
            document.querySelectorAll('.purpose:checked').forEach(cb => purposes.push(cb.value));

            const formData = new URLSearchParams();
            formData.append('thoiGianThamQuan', formattedTimeVisit);
            formData.append('phongKinhDoanh', document.getElementById('department').value);
            formData.append('tenNVKD', document.getElementById('name').value);
            formData.append('sdt', document.getElementById('phone').value);
            formData.append('cccd', document.getElementById('cccd').value);
            formData.append('slKhach', document.getElementById('guestCount').value);
            formData.append('tongNguoi', document.getElementById('totalCount').value);
            formData.append('bienSo', document.getElementById('plate').value);
            formData.append('mucDich', purposes.join(", "));
            formData.append('isLate', isLate);

            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyE1t53Uq6B12d2QUgn2t8wvJuL4_o2MOFHZzaIKjDFH5_3tQb341RcRJpNaBueczDPwQ/exec'; 

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                alert("Đăng ký tham quan thành công!");
                document.getElementById('bookingForm').reset();
                btn.innerText = "GỬI ĐĂNG KÝ"; btn.disabled = false;
            }).catch(err => { 
                alert("Lỗi mạng, vui lòng thử lại!"); 
                btn.innerText = "GỬI ĐĂNG KÝ"; btn.disabled = false; 
            });
        });
    </script>
</body>
</html>
